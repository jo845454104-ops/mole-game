<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>김가현 사과게임</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <h1 class="title">🍎 김가현 사과게임</h1>
      <p class="subtitle">드래그해서 합이 10이 되는 사과를 터뜨리세요!</p>
    </header>

    <div class="hud">
      <div class="hud__box">
        <span class="hud__label">점수</span>
        <span class="hud__value" id="score">0</span>
      </div>
      <div class="hud__box">
        <span class="hud__label">남은 시간</span>
        <span class="hud__value" id="time">2:00</span>
      </div>
      <button type="button" class="restart-btn" id="restart-btn">다시하기</button>
    </div>

    <div class="board-wrap">
      <div class="apple-grid" id="apple-grid"></div>
      <div class="selection-box" id="selection-box" hidden></div>
      <div class="sum-badge" id="sum-badge" hidden></div>

      <div class="overlay" id="start-overlay">
        <div class="overlay__card">
          <p class="overlay__title">김가현 사과게임</p>
          <p class="overlay__desc">2분 동안 합이 10이 되는 사과들을<br />드래그로 묶어서 최대한 많이 터뜨리세요!</p>
          <button type="button" class="play-btn" id="start-btn">게임 시작</button>
        </div>
      </div>

      <div class="overlay" id="end-overlay" hidden>
        <div class="overlay__card">
          <p class="overlay__title" id="end-title">시간 종료!</p>
          <p class="overlay__result"><span id="final-score">0</span>개 터뜨렸어요</p>
          <button type="button" class="play-btn" id="retry-btn">다시하기</button>
        </div>
      </div>
    </div>

    <p class="footer-note">* 친구끼리 하는 장난 미니게임입니다 :)</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
